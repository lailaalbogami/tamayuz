<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>منصة مدارس التميز الرسمية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>/* Layout: official gradient header band (MoE identity), white right-side nav with gradient active state, scrolling workspace. Single committed light theme. */
:root{
  --purple:#4A2577; --purple-dk:#33195A; --blue:#2453A6; --teal:#0F8A92; --tiffany:#12B5B0;
  --green:#0F8A92; --green-dk:#3A1F68; --green-soft:#E8F5F6; --tiff-soft:#E3F7F6; --purple-soft:#F0EAF8;
  --grad:linear-gradient(110deg,#3A1F68 0%,#4A2577 18%,#2453A6 50%,#0F8A92 80%,#12B5B0 100%);
  --grad-v:linear-gradient(180deg,#4A2577 0%,#2453A6 55%,#0F8A92 100%);
  --white:#FFFFFF; --bg:#F4F6FB; --muted:#646B7A; --line:#DDE2EE; --red:#C62828; --orange:#B76E00;
  --ink:#1D2033; --red-soft:#FBEAEA; --orange-soft:#FBF1E0; --blue-soft:#E8EEF8; --ok:#1E7A4E; --ok-soft:#E4F4EB;
  --font:"Cairo","Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.7;direction:rtl}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--grad);color:#fff;display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:72px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#3A1F68}
.hdr .crest{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-inline-end:14px;border-inline-end:1px solid rgba(255,255,255,.35);line-height:1.35;font-size:.74rem;text-align:center;opacity:.95}
.hdr .crest b{font-size:.84rem;font-weight:700}
.hdr .sch{min-width:0;flex:1}
.hdr .sch h1{margin:0;font-size:1.35rem;font-weight:800;color:#fff;line-height:1.35;text-wrap:balance}
.hdr .sch .sub{font-size:.78rem;color:rgba(255,255,255,.88);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.official{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:0 10px;font-weight:700;font-size:.74rem;color:#fff}
.official svg{width:13px;height:13px}
.hdr-actions{display:flex;align-items:center;gap:6px;flex:none}
.iconbtn{position:relative;width:38px;height:38px;border-radius:var(--r);border:1px solid var(--line);background:var(--white);display:grid;place-items:center;cursor:pointer;color:var(--purple)}
.iconbtn:hover{background:var(--purple-soft)}
.hdr .iconbtn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
.hdr .iconbtn:hover{background:rgba(255,255,255,.26)}
.iconbtn svg{width:19px;height:19px}
.badge-dot{position:absolute;top:-6px;left:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font-size:.7rem;display:grid;place-items:center;padding:0 4px;font-weight:700;border:2px solid #fff}
.userbtn{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;border-radius:var(--r);padding:4px 10px;cursor:pointer;max-width:230px}
.userbtn:hover{background:rgba(255,255,255,.26)}
.userbtn .av{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--purple);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.userbtn .ut{min-width:0;text-align:right;line-height:1.3}
.userbtn .ut b{display:block;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbtn .ut small{color:rgba(255,255,255,.85);font-size:.72rem}
.menu-toggle{display:none}

/* Shell */
.shell{display:flex;min-height:calc(100% - 72px)}
.nav{width:240px;flex:none;background:var(--white);border-inline-start:1px solid var(--line);color:var(--ink);padding:14px 10px;transition:width .2s;position:sticky;top:calc(72px + env(safe-area-inset-top,0px));height:calc(100vh - 72px);overflow-y:auto}
.nav.collapsed{width:66px}
.nav .item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);padding:9px 11px;border-radius:8px;cursor:pointer;text-align:right;white-space:nowrap;overflow:hidden;font-weight:600}
.nav .item svg{width:20px;height:20px;flex:none;color:var(--purple)}
.nav .item:hover{background:var(--purple-soft)}
.nav .item.active{background:var(--grad);color:#fff;font-weight:700}
.nav .item.active svg{color:#fff}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.nav.collapsed .lbl{display:none}
.nav .collapse{margin-top:8px;color:var(--muted);font-weight:400}
.main{flex:1;min-width:0;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:4px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs button{border:0;background:none;color:var(--green);cursor:pointer;padding:0}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.page-title h2{margin:0;font-size:1.4rem;color:var(--purple-dk);font-weight:800}
.page-title p{margin:0;color:var(--muted);font-size:.88rem}

.demo-banner{background:var(--orange-soft);border:1px solid #E9CF9E;color:#6B4400;border-radius:var(--r);padding:8px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.86rem}
.demo-banner b{color:var(--orange)}

/* Cards & KPIs */
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{margin:0 0 10px;font-size:1rem;color:var(--green-dk)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.kpi{position:relative;overflow:hidden;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:2px}
.kpi::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--grad)}
.kpi:hover{border-color:var(--teal)}
.kpi .k-l{font-size:.8rem;color:var(--muted)}
.kpi .k-v{font-size:1.65rem;font-weight:800;color:var(--green-dk);line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:.76rem;color:var(--muted)}
.kpi.warn .k-v{color:var(--orange)} .kpi.crit .k-v{color:var(--red)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#4A2577,#2453A6,#12B5B0)}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.three{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}

.hbar{display:grid;grid-template-columns:minmax(90px,30%) 1fr 46px;align-items:center;gap:8px;font-size:.84rem;margin:6px 0}
.hbar .tr{height:14px;background:var(--bg);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:linear-gradient(270deg,#4A2577,#2453A6 55%,#12B5B0)}
.hbar span:last-child{text-align:left;font-variant-numeric:tabular-nums;color:var(--muted)}

.alist{list-style:none;margin:0;padding:0}
.alist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.alist li:last-child{border-bottom:0}
.alist button.lnk{border:0;background:none;color:var(--ink);cursor:pointer;text-align:right;padding:0;flex:1;min-width:0}
.alist button.lnk:hover{color:var(--green)}
.alist small{color:var(--muted);display:block}

/* Toolbar & tables */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar .search{flex:1 1 220px;min-width:0;position:relative}
.toolbar .search input{width:100%;padding:7px 34px 7px 10px}
.toolbar .search svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters select,.filters input{max-width:190px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=search],select,textarea{border:1px solid var(--line);background:var(--white);border-radius:6px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:76px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--white);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--green-dk)}
.btn:hover{background:var(--green-soft)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:#EBC5C5}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{padding:3px 8px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + 4px);left:0;background:var(--white);border:1px solid var(--line);border-radius:var(--r);min-width:200px;z-index:20;padding:4px;box-shadow:0 6px 18px rgba(20,92,70,.12)}
.dd-menu button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;padding:8px 10px;border-radius:5px;cursor:pointer;text-align:right}
.dd-menu button:hover{background:var(--green-soft)}
.dd-menu svg{width:16px;height:16px;color:var(--green)}

.tblwrap{overflow-x:auto;background:var(--white);border:1px solid var(--line);border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{background:var(--purple-soft);color:var(--purple-dk);font-weight:700;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.nos{cursor:default}
.tbl th .sa{opacity:.5;font-size:.7rem;margin-inline-start:4px}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;max-width:320px}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#FAFCFB}
.tbl td.clip{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tbl .acts{white-space:nowrap;display:flex;gap:4px}
.empty{padding:32px;text-align:center;color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:.85rem;color:var(--muted)}
.pager .pg{display:flex;gap:4px;flex-wrap:wrap}
.pager .pg button{min-width:32px;border:1px solid var(--line);background:var(--white);border-radius:5px;padding:3px 8px;cursor:pointer}
.pager .pg button.on{background:var(--purple);color:#fff;border-color:var(--purple)}

.pill{display:inline-block;padding:1px 9px;border-radius:12px;font-size:.76rem;font-weight:700;white-space:nowrap;border:1px solid transparent}
.p-green{background:var(--ok-soft);color:var(--ok);border-color:#BFE3CE}
.p-orange{background:var(--orange-soft);color:var(--orange);border-color:#EDD3A6}
.p-red{background:var(--red-soft);color:var(--red);border-color:#F0C2C2}
.p-grey{background:#EEF1F0;color:var(--muted);border-color:var(--line)}
.p-blue{background:var(--blue-soft);color:var(--blue);border-color:#C9D7E6}
.demo-chip{font-size:.66rem;background:#FFF6E5;color:var(--orange);border:1px dashed #E2B866;border-radius:4px;padding:0 5px;margin-inline-start:6px;vertical-align:middle;font-weight:700}
.minibar{display:flex;align-items:center;gap:6px;min-width:90px}
.minibar .tr{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.minibar .tr i{display:block;height:100%;background:linear-gradient(270deg,#2453A6,#12B5B0)}
.minibar span{font-size:.78rem;font-variant-numeric:tabular-nums;width:36px}

.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.subtabs button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:600}
.subtabs button.on{color:var(--purple-dk);border-bottom-color:var(--teal)}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(20,40,34,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--white);border-radius:10px;width:min(860px,100%);border:1px solid var(--line)}
.modal.sm{width:min(480px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:1.05rem;color:var(--green-dk)}
.modal-b{padding:16px}
.modal-f{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:#FAFCFB;border-radius:0 0 10px 10px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.form .f.wide{grid-column:1/-1}
.form label{font-size:.82rem;font-weight:700;color:var(--green-dk)}
.form label .req{color:var(--red)}
.form .err{color:var(--red);font-size:.76rem;min-height:0}
.form .f.bad input,.form .f.bad select,.form .f.bad textarea{border-color:var(--red)}
.form .hint{font-size:.74rem;color:var(--muted)}
.chk-grid{display:flex;flex-wrap:wrap;gap:6px 14px;max-height:140px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:8px}
.chk-grid label{font-weight:400;color:var(--ink);display:flex;gap:5px;align-items:center;font-size:.84rem}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.dl .d{min-width:0}
.dl .d.wide{grid-column:1/-1}
.dl dt{font-size:.76rem;color:var(--muted);font-weight:700}
.dl dd{margin:0;white-space:pre-wrap;word-break:break-word}
.sec-h{font-size:.95rem;color:var(--green-dk);margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.att{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;font-size:.84rem;flex-wrap:wrap}
.att .ext{font-weight:800;font-size:.7rem;background:var(--green-soft);color:var(--green-dk);border-radius:4px;padding:2px 6px;text-transform:uppercase}
.att .nm{flex:1;min-width:120px;word-break:break-all}
.att small{color:var(--muted)}
.note-box{background:var(--blue-soft);color:#1F4466;border-radius:6px;padding:8px 10px;font-size:.8rem;margin-bottom:8px}
.timeline{border-right:2px solid var(--line);padding-right:14px;margin-right:6px}
.timeline .ev{position:relative;padding-bottom:12px}
.timeline .ev::before{content:"";position:absolute;right:-21px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--white);border:3px solid var(--green)}
.timeline .ev b{color:var(--green-dk)}
.timeline .ev small{color:var(--muted)}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.cmp div{border:1px solid var(--line);border-radius:6px;padding:8px}
.cmp small{display:block;color:var(--muted);font-size:.74rem}
.cmp b{font-size:1.2rem;font-variant-numeric:tabular-nums;color:var(--green-dk)}

/* Toast */
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--green-dk);color:#fff;border-radius:8px;padding:10px 14px;font-size:.88rem;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.toast.err{background:var(--red)} .toast.warn{background:var(--orange)}

/* Month timeline view */
.gantt td.m{padding:0;min-width:34px;border-left:1px solid var(--line)}
.gantt td.m i{display:block;height:14px;margin:9px 2px;background:var(--tiffany);border-radius:3px}
.gantt td.m i.late{background:var(--red)} .gantt td.m i.done{background:var(--purple)}

/* Committee cards */
.cmte{display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:right;border:1px solid var(--line);border-radius:var(--r);background:var(--white);padding:14px}
.cmte:hover{border-color:var(--green)}
.cmte h4{margin:0;color:var(--green-dk);font-size:1rem}
.cmte .row{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.perm-tbl td,.perm-tbl th{text-align:center}
.perm-tbl td:first-child,.perm-tbl th:first-child{text-align:right}
.ok{color:var(--ok);font-weight:800} .no{color:#B9C3BF}
.lock{background:var(--red-soft);border:1px solid #F0C2C2;color:var(--red);border-radius:6px;padding:12px;font-size:.88rem}

/* Report sheet (used offscreen for PDF and print) */
.rpt{width:1100px;background:#fff;color:#1E2B27;font-family:var(--font);direction:rtl;padding:28px 34px;font-size:12.5px}
.rpt-h{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--teal);border-image:var(--grad) 1;padding-bottom:10px;margin-bottom:12px;gap:16px}
.rpt-h h1{margin:0;font-size:20px;color:var(--green-dk);font-weight:800}
.rpt-h .meta{font-size:11px;color:var(--muted);text-align:left}
.rpt h2{font-size:15px;margin:0 0 8px;color:var(--green-dk)}
.rpt table{width:100%;border-collapse:collapse}
.rpt th{background:var(--purple);color:#fff;padding:6px;border:1px solid var(--purple-dk);font-size:11.5px;text-align:right}
.rpt td{padding:5px 6px;border:1px solid var(--line);vertical-align:top;font-size:11.5px;overflow-wrap:break-word}
.rpt tr:nth-child(even) td{background:#F7FAF9}
.rpt-f{display:flex;justify-content:space-between;color:var(--muted);font-size:10.5px;margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.rpt .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;margin-bottom:10px}
.rpt .kv div{border-bottom:1px dotted var(--line);padding:3px 0}
.rpt .kv b{color:var(--green-dk)}

@media (max-width:900px){
  .menu-toggle{display:grid}
  .nav{position:fixed;top:0;bottom:0;right:0;height:100%;z-index:70;transform:translateX(100%);transition:transform .2s;width:260px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .nav.collapsed{width:260px}
  .nav.collapsed .lbl{display:inline}
  .nav.open{transform:none}
  .nav .collapse{display:none}
  .nav-back{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:65}
  .userbtn .ut{display:none}
  .hdr .sch h1{font-size:1.05rem}
}
@media (max-width:600px){
  .form,.dl{grid-template-columns:1fr}
  .hdr .sch .sub span.opt{display:none}
  .filters select,.filters input{max-width:none;flex:1 1 140px}
  .cmp{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Visible choice chips (replace dropdowns) */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.chip span,.chip.btnchip{display:inline-block;border:1px solid var(--line);background:var(--white);border-radius:20px;padding:3px 12px;font-size:.82rem;cursor:pointer;color:var(--ink);font-weight:600;white-space:nowrap}
.chip span:hover,.chip.btnchip:hover{border-color:var(--teal);background:var(--tiff-soft)}
.chip input:checked+span,.chip.btnchip.on{background:var(--grad);color:#fff;border-color:transparent}
.chip input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.chips.scroll{max-height:150px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px}

  ok: true, mem: {},
  get(k) { try { const v = localStorage.getItem(k); return v == null ? (this.mem[k] ?? null) : JSON.parse(v); } catch (e) { this.ok = false; return this.mem[k] ?? null; } },
  set(k, v) { this.mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { this.ok = false; return false; } },
  del(k) { delete this.mem[k]; try { localStorage.removeItem(k); } catch (e) { } }
};

/* ---- IndexedDB for attachment blobs ---- */
const FileDB = {
  db: null, ok: false, mem: new Map(),
  async init() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('sp_files_v1', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('files');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        setTimeout(() => rej(new Error('timeout')), 3000);
      });
      this.ok = true;
    } catch (e) { this.ok = false; }
  },
  tx(mode) { return this.db.transaction('files', mode).objectStore('files'); },
  async put(id, blob) {
    if (!this.ok) { this.mem.set(id, blob); return; }
    await new Promise((res, rej) => { const r = this.tx('readwrite').put(blob, id); r.onsuccess = res; r.onerror = () => rej(r.error); });
  },
  async get(id) {
    if (!this.ok) return this.mem.get(id) || null;
    return new Promise((res) => { const r = this.tx('readonly').get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); });
  },
  async del(id) {
    this.mem.delete(id);
    if (!this.ok) return;
    await new Promise(res => { const r = this.tx('readwrite').delete(id); r.onsuccess = res; r.onerror = res; });
  }
};

const OFFICIAL = { name: 'مدارس التميز الابتدائية – بنات', ministry: 'وزارة التعليم', country: 'المملكة العربية السعودية', directorate: 'الإدارة العامة للتعليم', office: 'مكتب التعليم', headerNote: 'المنصة الرسمية للمدرسة', footerNote: 'وثيقة رسمية داخلية', logo: '', ministryLogo: '' };
function normalizeOfficial(d, meta) {
  const clean = v => typeof v === 'string' ? v.replace(/ ?\((?:شريك |اسم |حساب )?تجريبي\)/g, '').replace(/_تجريبية?_/g, '_').replace(/_تجريبية?(?=\.)/g, '') : v;
  const walk = o => { if (Array.isArray(o)) return o.map(walk); if (o && typeof o === 'object') { for (const k in o) o[k] = walk(o[k]); return o; } return clean(o); };
  COLLS.forEach(c => d[c] = walk(d[c]));
  Object.assign(d.settings, OFFICIAL);
  if (meta) { meta.users.forEach(u => u.name = clean(u.name).replace(' (اطلاع)', '')); meta.schools.forEach(sc => sc.name = OFFICIAL.name); }
}

/* ---- Data store ---- */
const META_KEY = 'sp_meta_v1';
const schoolKey = id => 'sp_school_v1_' + id;

const Store = {
  meta: null, data: null, user: null, schoolId: null, listeners: [],

  init() {
    let meta = LS.get(META_KEY);
    if (!meta || !meta.schools) {
      meta = {
        schools: [{ id: 's1', name: SEED.build().settings.name, demo: true }],
        users: [
          { id: 'u1', name: 'مديرة النظام', role: 'admin', schoolId: 's1' },
          { id: 'u2', name: SEED.staff.leader, role: 'leader', schoolId: 's1' },
          { id: 'u3', name: SEED.staff.d1, role: 'deputy', schoolId: 's1' },
          { id: 'u4', name: 'نورة سعد القحطاني', role: 'teacher', schoolId: 's1' },
          { id: 'u5', name: SEED.staff.counselor, role: 'committee', schoolId: 's1' },
          { id: 'u6', name: SEED.staff.safety, role: 'safety', schoolId: 's1' },
          { id: 'u7', name: 'مشرفة زائرة', role: 'viewer', schoolId: 's1' }
        ],
        currentUserId: 'u2'
      };
      LS.set(META_KEY, meta);
    }
    // single-school edition: keep only the one school and its users
    if (meta.schools.length > 1 || meta.users.some(u => u.schoolId !== 's1')) {
      meta.schools.filter(sc => sc.id !== 's1').forEach(sc => LS.del(schoolKey(sc.id)));
      meta.schools = meta.schools.filter(sc => sc.id === 's1');
      if (!meta.schools.length) meta.schools = [{ id: 's1', name: SEED.build().settings.name, demo: true }];
      meta.users = meta.users.filter(u => u.schoolId === 's1');
      if (!meta.users.some(u => u.id === meta.currentUserId)) meta.currentUserId = meta.users[0]?.id;
      LS.set(META_KEY, meta);
    }
    this.meta = meta;
    const u = meta.users.find(x => x.id === meta.currentUserId) || meta.users[0];
    this.setUser(u.id, true);
  },
  saveMeta() { LS.set(META_KEY, this.meta); },
  role() { return ROLES[this.user?.role] || ROLES.viewer; },

  setUser(id, silent) {
    const u = this.meta.users.find(x => x.id === id);
    if (!u) throw new Error('المستخدم غير موجود');
    this.user = u; this.meta.currentUserId = id; this.saveMeta();
    this.openSchool(u.schoolId, true);
    if (!silent) this.emit();
  },

  openSchool(id, force) {
    if (!force && this.schoolId === id) return;
    if (id !== 's1') throw new PermError('هذه النسخة مخصصة لمدرسة واحدة');
    let d = LS.get(schoolKey(id));
    if (!d) {
      const sc = this.meta.schools.find(s => s.id === id);
      d = this.freshSchool(sc?.demo, sc?.name);
      LS.set(schoolKey(id), d);
    }
    COLLS.forEach(c => { if (!Array.isArray(d[c])) d[c] = []; });
    if (!Array.isArray(d.log)) d.log = [];
    normalizeOfficial(d, this.meta);
    this.data = d; this.schoolId = id;
  },

  freshSchool(withDemo, name) {
    const now = new Date().toISOString();
    const base = SEED.build();
    const settings = { ...base.settings };
    if (name) settings.name = name;
    const d = { settings, seeded: !!withDemo, log: [] };
    COLLS.forEach(c => d[c] = []);
    if (!withDemo) { settings.leader = ''; return d; }
    const idMap = {};
    COLLS.forEach(c => (base[c] || []).forEach(r => { const id = uid(); if (r._id) idMap[r._id] = id; r.__id = id; }));
    COLLS.forEach(c => {
      d[c] = (base[c] || []).map(r => {
        const rec = { ...JSON.parse(JSON.stringify(r)), id: r.__id, demo: true, createdAt: now, updatedAt: now, createdBy: 'بيانات تجريبية' };
        delete rec._id; delete rec.__id;
        ['teacherId', 'deputyId', 'committeeId', 'meetingId', 'partnerId'].forEach(k => { if (rec[k] && idMap[rec[k]]) rec[k] = idMap[rec[k]]; });
        if (c === 'teachers') rec.classes = asArr(rec.classes).join('، ');
        if (c === 'decisions') { rec.link = rec.linkType ? rec.linkType + ':' + rec.linkNo : ''; delete rec.linkType; delete rec.linkNo; }
        return rec;
      });
    });
    d.log.push({ at: now, user: 'النظام', action: 'تهيئة', module: 'النظام', title: 'تحميل البيانات التجريبية' });
    return d;
  },

  save() {
    const ok = LS.set(schoolKey(this.schoolId), this.data);
    if (!ok) toast('تعذّر الحفظ الدائم في هذا المتصفح. التعديلات محفوظة مؤقتًا حتى إغلاق الصفحة.', 'warn');
    return ok;
  },
  on(fn) { this.listeners.push(fn); },
  emit() { this.listeners.forEach(f => f()); },

  can(perm, coll) {
    const r = this.role();
    if (!r.perms.includes(perm)) return false;
    if (coll && SENSITIVE_COLLS.includes(coll) && !r.sensitive) return false;
    if (coll && ['add', 'edit', 'delete', 'attach'].includes(perm)) {
      const mod = COLL_MODULE[coll] || coll;
      if (r.write !== '*' && !r.write.includes(mod)) return false;
    }
    return true;
  },
  require(perm, coll) {
    if (!this.can(perm, coll)) throw new PermError('ليست لديك صلاحية «' + PERMS[perm] + '» في هذا القسم');
  },

  list(coll) {
    if (SENSITIVE_COLLS.includes(coll) && !this.role().sensitive) return [];
    return this.data[coll] || [];
  },
  get(coll, id) { return this.list(coll).find(r => r.id === id) || null; },

  add(coll, rec, title) {
    this.require('add', coll);
    const now = new Date().toISOString();
    const r = { year: this.data.settings.year, semester: this.data.settings.semester, attachments: [], ...rec, id: uid(), createdAt: now, updatedAt: now, createdBy: this.user.name, demo: false };
    this.data[coll].push(r);
    this.log('إضافة', coll, title || '');
    this.save(); return r;
  },
  update(coll, id, patch, title, perm = 'edit') {
    this.require(perm, coll);
    const r = this.data[coll].find(x => x.id === id);
    if (!r) throw new Error('السجل غير موجود، ربما حُذف');
    Object.assign(r, patch, { updatedAt: new Date().toISOString(), updatedBy: this.user.name });
    this.log(perm === 'attach' ? 'مرفقات' : 'تعديل', coll, title || '');
    this.save(); return r;
  },
  remove(coll, id, title) {
    this.require('delete', coll);
    const i = this.data[coll].findIndex(x => x.id === id);
    if (i < 0) throw new Error('السجل غير موجود');
    const [r] = this.data[coll].splice(i, 1);
    (r.attachments || []).forEach(a => FileDB.del(a.id));
    this.log('حذف', coll, title || '');
    this.save(); return r;
  },
  log(action, coll, title) {
    const def = DEFS[coll];
    this.data.log.unshift({ at: new Date().toISOString(), user: this.user.name, role: this.role().label, action, module: def ? def.title : coll, title });
    if (this.data.log.length > 400) this.data.log.length = 400;
  },

  /* settings & admin */
  saveSettings(patch) {
    this.require('settings');
    Object.assign(this.data.settings, patch);
    const sc = this.meta.schools.find(s => s.id === this.schoolId);
    if (sc && patch.name) { sc.name = patch.name; this.saveMeta(); }
    this.log('تعديل', 'settings', 'إعدادات المدرسة');
    this.save();
  },
  schoolUsers() { return this.meta.users.filter(u => u.schoolId === this.schoolId); },
  upsertUser(u) {
    this.require('users');
    if (u.role === 'admin' && this.user.role !== 'admin') throw new PermError('لا يمكن منح دور مديرة النظام إلا من مديرة النظام');
    if (u.id) { const x = this.meta.users.find(y => y.id === u.id && y.schoolId === this.schoolId); if (!x) throw new PermError('لا يمكن تعديل مستخدم من مدرسة أخرى'); Object.assign(x, u); }
    else this.meta.users.push({ ...u, id: uid(), schoolId: this.schoolId });
    this.saveMeta(); this.log(u.id ? 'تعديل' : 'إضافة', 'users', 'مستخدم: ' + u.name); this.save();
  },
  deleteUser(id) {
    this.require('users');
    if (id === this.user.id) throw new Error('لا يمكن حذف المستخدم الحالي');
    const x = this.meta.users.find(y => y.id === id && y.schoolId === this.schoolId);
    if (!x) throw new PermError('لا يمكن حذف مستخدم من مدرسة أخرى');
    this.meta.users = this.meta.users.filter(y => y.id !== id);
    this.saveMeta(); this.log('حذف', 'users', 'مستخدم: ' + x.name); this.save();
  },
  removeDemo() {
    this.require('settings');
    let n = 0;
    COLLS.forEach(c => { const before = this.data[c].length; this.data[c] = this.data[c].filter(r => !r.demo); n += before - this.data[c].length; });
    this.data.seeded = false;
    this.log('حذف', 'settings', 'حذف البيانات التجريبية (' + n + ' سجلًا)');
    this.save(); return n;
  },
  resetDemo() {
    this.require('settings');
    const keep = this.data.settings;
    const d = this.freshSchool(true, keep.name);
    d.settings = { ...d.settings, ...keep };
    this.data = d; this.save();
  },
  importBackup(obj) {
    this.require('settings');
    if (!obj || typeof obj !== 'object' || !obj.settings || !COLLS.some(c => Array.isArray(obj[c]))) throw new Error('الملف ليس نسخة احتياطية صالحة لهذه المنصة');
    COLLS.forEach(c => { if (!Array.isArray(obj[c])) obj[c] = []; });
    if (!Array.isArray(obj.log)) obj.log = [];
    this.data = obj; this.log('استيراد', 'settings', 'استعادة نسخة احتياطية'); this.save();
  },
  backup() { this.require('export'); return JSON.parse(JSON.stringify(this.data)); }
};

const DONE = ['مكتمل', 'مكتملة', 'منفذ', 'مغلقة', 'ملغى', 'ملغاة', 'منعقد'];

function staffNames() {
  const s = new Set();
  const st = Store.data?.settings;
  if (st?.leader) s.add(st.leader);
  Store.list('deputies').forEach(d => s.add(d.name));
  Store.list('teachers').forEach(t => s.add(t.name));
  Store.list('committees').forEach(c => { if (c.chair) s.add(c.chair); });
  Object.values(SEED.staff).forEach(n => { if (Store.data?.seeded) s.add(n); });
  Store.schoolUsers().forEach(u => { if (!['admin', 'viewer'].includes(u.role)) s.add(u.name); });
  return [...s].filter(Boolean).sort((a, b) => a.localeCompare(b, 'ar'));
}
const refOpts = (coll, label = 'name') => () => Store.list(coll).map(r => ({ v: r.id, l: r[label] }));
const refLabel = (coll, id, label = 'name') => Store.get(coll, id)?.[label] || '';
const pctOf = (actual, target) => target > 0 ? clamp(Math.round(actual / target * 100), 0, 100) : 0;

function impPct(r) {
  const b = num(r.baseline), t = num(r.target), c = num(r.current);
  if (t === b) return c === t ? 100 : 0;
  return clamp(Math.round((c - b) / (t - b) * 100), 0, 100);
}
function isLate(r, dateKey, doneVals = DONE) {
  const d = r[dateKey]; if (!d) return false;
  if (doneVals.includes(r.status)) return false;
  return d < todayISO();
}

function fieldOpts(fd, rec) {
  let o = typeof fd.o === 'function' ? fd.o(rec) : (fd.o || []);
  return o.map(x => typeof x === 'object' ? x : { v: x, l: x });
}
function rawVal(def, k, r) { const fd = def.f[k]; if (fd?.t === 'computed') return fd.f(r); return r[k]; }
function textVal(def, k, r) {
  const fd = def.f[k]; const v = rawVal(def, k, r);
  if (!fd) return v ?? '';
  if (fd.t === 'ref' || (fd.t === 'select' && fd.o && typeof (typeof fd.o === 'function' ? fd.o(r)[0] : fd.o[0]) === 'object')) { const o = fieldOpts(fd, r).find(x => x.v === v); return o ? o.l : (v || ''); }
  if (fd.t === 'multi') return asArr(v).join('، ');
  if (fd.t === 'date') return fmtDate(v);
  if (fd.pct) return (v ?? 0) + '%';
  return v ?? '';
}
function statusClass(v) {
  if (['متأخر', 'متأخرة', 'متعثر', 'متعثرة', 'حرج', 'غير سليم'].includes(v)) return 'p-red';
  if (['مفتوحة', 'قيد المعالجة', 'عالٍ', 'محالة', 'قيد المتابعة', 'عالية', 'مؤجل'].includes(v)) return 'p-orange';
  if (['جارٍ التنفيذ', 'جارية', 'قيد التنفيذ', 'قادم', 'متوسط', 'متوسطة'].includes(v)) return 'p-blue';
  if (['مكتمل', 'مكتملة', 'منفذ', 'مغلقة', 'منعقد', 'سليم', 'منخفض', 'منخفضة'].includes(v)) return 'p-green';
  return 'p-grey';
}
function nextNo(def) {
  const a = def.autoNo; const w = a.w || 2;
  const max = Store.data[def.coll].reduce((m, r) => { const n = parseInt(String(r[a.k] || '').replace(/\D/g, '')) || 0; return Math.max(m, n); }, 0);
  return a.p + String(max + 1).padStart(w, '0');
}
function recTitle(def, r) { return String(rawVal(def, def.titleField, r) || def.single).slice(0, 90); }

/* ===== Files out: downloads, reports, XLSX/CSV/PDF/DOCX, print, attachments ===== */
let DL = null; // claude downloads capability (null when running as a plain page)
(async () => { try { if (window.claude?.use) DL = await window.claude.use('downloads'); } catch (e) { DL = null; } })();

const DL_OK = ['gif', 'png', 'jpg', 'jpeg', 'webp', 'txt', 'json', 'md', 'docx', 'pptx', 'csv', 'html', 'svg', 'pdf', 'xlsx', 'zip'];
async function saveBlob(filename, blob) {
  const ext = (filename.split('.').pop() || '').toLowerCase();
  if (DL && !DL_OK.includes(ext) && window.JSZip) {
    const z = new window.JSZip(); z.file(filename, blob);
    blob = await z.generateAsync({ type: 'blob' }); filename = filename.replace(/\.[^.]+$/, '') + '.zip';
    toast('هذه الصيغة تُحفظ داخل ملف مضغوط في هذا العارض.', 'warn');
  }
  if (DL) {
    try { await DL.save({ filename, data: blob }); toast('تم حفظ الملف: ' + filename); return true; }
    catch (e) {
      if (e?.code === 'declined') { toast('أُلغي الحفظ.', 'warn'); return false; }
      if (e?.code === 'rejected_extension' || e?.code === 'extension_not_enabled') { toast('صيغة الملف غير متاحة للحفظ في هذا العارض.', 'err'); return false; }
      if (e?.code === 'rate_limited') { toast('هناك نافذة حفظ مفتوحة بالفعل. أكمليها ثم أعيدي المحاولة.', 'warn'); return false; }
      if (e?.code !== 'unavailable' && e?.code !== 'not_granted') { toast('تعذّر حفظ الملف: ' + (e?.message || ''), 'err'); return false; }
    }
  }
  if (FRAMED && !DL) { toast('تنزيل الملفات غير متاح داخل هذا العارض. افتحي ملف المنصة في المتصفح مباشرة.', 'err'); return false; }
  const url = URL.createObjectURL(blob);

/* ---- PDF via paginated HTML pages rendered to canvas ---- */
async function exportPDF(rep) {
  if (!window.jspdf || !window.html2canvas) { toast('مكتبة PDF لم تُحمَّل. تحققي من الاتصال بالإنترنت وأعيدي المحاولة.', 'err'); return; }
  toast('جارٍ إنشاء ملف PDF…');
  const land = rep.orientation === 'landscape';
  const W = land ? 1100 : 780, H = Math.round(W * (land ? 210 / 297 : 297 / 210));
  const host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-20000px;top:0;z-index:-1';
  document.body.appendChild(host);
  const pages = [];
  const newPage = (first) => {
    const p = document.createElement('div'); p.className = 'rpt'; p.style.cssText = `width:${W}px;height:${H}px;overflow:hidden;position:relative`;
    p.innerHTML = (first ? rptHeaderHTML(rep) : `<div class="rpt-h" style="padding-bottom:6px;margin-bottom:8px"><h1 style="font-size:15px">${esc(Store.data.settings.name)}</h1><div class="meta">${esc(rep.title)}</div></div>`) + '<div class="pc"></div>';
    host.appendChild(p); pages.push(p); return p.querySelector('.pc');
  };
  const limit = H - 60;
  let pc = newPage(true);
  const over = () => pc.offsetTop + pc.offsetHeight > limit;
  try {
    if (document.fonts?.ready) await document.fonts.ready;
    for (const b of rep.blocks) {
      if (b.type !== 'table') {
        const el = document.createElement('div'); el.innerHTML = blockHTML(b); pc.appendChild(el);
        if (over() && pc.children.length > 1) { el.remove(); pc = newPage(false); pc.appendChild(el); }
        continue;
      }
      const mk = () => { const t = document.createElement('table'); t.innerHTML = `<thead><tr>${b.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody></tbody>`; pc.appendChild(t); return t.tBodies[0]; };
      let tb = mk();
      if (!b.rows.length) { const tr = tb.insertRow(); tr.innerHTML = `<td colspan="${b.cols.length}" style="text-align:center">لا توجد سجلات</td>`; }
      for (const row of b.rows) {
        const tr = document.createElement('tr'); tr.innerHTML = row.map(c => `<td>${esc(c)}</td>`).join(''); tb.appendChild(tr);
        if (over() && tb.rows.length > 1) { tr.remove(); pc = newPage(false); tb = mk(); tb.appendChild(tr); }
      }
    }
    const pdf = new window.jspdf.jsPDF({ orientation: rep.orientation, unit: 'mm', format: 'a4' });
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    for (let i = 0; i < pages.length; i++) {
      const foot = document.createElement('div');
      foot.className = 'rpt-f'; foot.style.cssText = `position:absolute;bottom:18px;left:34px;right:34px`;
      foot.innerHTML = `<span>${esc(Store.data.settings.footerNote || '')}</span><span>صفحة ${i + 1} من ${pages.length}</span>`;
      pages[i].appendChild(foot);
      const c = await window.html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff', logging: false, useCORS: true });
      if (i) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, pw, ph);
    }
    await saveBlob(safeName(rep.title) + '_' + stamp() + '.pdf', pdf.output('blob'));
  } catch (e) { console.error(e); toast('تعذّر إنشاء PDF: ' + e.message, 'err'); }
  finally { host.remove(); }
}

async function exportXLSX(title, cols, rows) {
  if (!window.XLSX) { toast('مكتبة Excel لم تُحمَّل. تحققي من الاتصال بالإنترنت.', 'err'); return; }

  const ws = XLSX.utils.aoa_to_sheet(aoa);

  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: aoa.length - 1, c: cols.length - 1 } }) };
  const s = Store.data.settings;
  const info = XLSX.utils.aoa_to_sheet([['المدرسة', s.name], ['التقرير', title], ['العام الدراسي', s.year], ['الفصل الدراسي', s.semester], ['تاريخ الإصدار', fmtDate(todayISO())], ['عدد السجلات', rows.length]]);

  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });

async function exportCSV(title, cols, rows) {
  const q = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '﻿' + [cols.map(c => q(c.l)).join(','), ...rows.map(r => cols.map(c => q(c.x ? c.x(r) : c.v(r))).join(','))].join('\r\n');
  await saveBlob(safeName(title) + '_' + stamp() + '.csv', new Blob([csv], { type: 'text/csv;charset=utf-8' }));

/* Dispatch one export format for a set of rows */
function runExport(fmt, { title, cols, rows, pdfCols, extra }) {
  if (fmt !== 'print' && !Store.can('export')) { toast('ليست لديك صلاحية التصدير', 'err'); return; }
  const pc = pdfCols || cols;
  if (fmt === 'xlsx') return exportXLSX(title, cols, rows);
  if (fmt === 'csv') return exportCSV(title, cols, rows);
  const rep = tableReport(title, pc, rows, extra || {});
  if (fmt === 'pdf') return exportPDF(rep);
  if (fmt === 'docx') return exportDOCX(rep);
  if (fmt === 'print') return printReport(rep);
}

/* ---------- Excel import ---------- */
function importExcel(def, preset) {
  if (!window.XLSX) return toast('مكتبة Excel لم تُحمَّل.', 'err');
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,.xls,.csv';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: true });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
      if (rows.length < 2) throw new Error('الملف لا يحتوي على بيانات');
      const head = rows[0].map(h => String(h).trim());
      const map = head.map(h => def.fields.find(fd => fd.l === h && fd.t !== 'computed'));
      if (!map.some(Boolean)) throw new Error('لم تُطابق عناوين الأعمدة حقول القسم. استخدمي «قالب الاستيراد».');
      let ok = 0, skip = 0;
      rows.slice(1).forEach(row => {
        if (row.every(c => c === '')) return;
        const rec = { ...preset };
        map.forEach((fd, i) => {
          if (!fd || fd.ro) return; let v = row[i];
          if (v instanceof Date) v = isoDate(v);
          if (fd.t === 'number') v = v === '' ? '' : num(v);
          else if (fd.t === 'multi') v = asArr(v);
          else if (fd.t === 'ref') { const o = fieldOpts(fd, rec).find(o => o.l === String(v).trim() || o.v === v); v = o ? o.v : ''; }
          else if (fd.t === 'date' && v && !/^\d{4}-\d{2}-\d{2}$/.test(String(v))) { const d = new Date(v); v = isNaN(d) ? '' : isoDate(d); }
          else v = String(v).trim();
          rec[fd.k] = v;
        });
        if (def.autoNo) rec[def.autoNo.k] = nextNo(def);
        if (def.f.semester && !rec.semester) rec.semester = Store.data.settings.semester;
        const missing = def.fields.filter(fd => fd.req && !fd.ro && fd.t !== 'computed' && (rec[fd.k] === '' || rec[fd.k] == null || (Array.isArray(rec[fd.k]) && !rec[fd.k].length)));
        if (missing.length) { skip++; return; }
        def.beforeSave?.(rec);
        Store.add(def.coll, rec, 'استيراد: ' + recTitle(def, rec)); ok++;
      });
      toast(`تم استيراد ${ok} سجل${skip ? ` وتجاهل ${skip} صفًا لنقص حقول مطلوبة` : ''}`, skip ? 'warn' : '');
      render();
    } catch (e) { toast('تعذّر الاستيراد: ' + e.message, 'err'); }
  };
  inp.click();
}

/* ---------- alerts ---------- */
function computeAlerts() {
  const out = []; const t = todayISO(); const nd = num(Store.data.settings.notifyDays) || 7;
  const lim = isoDate(new Date(Date.now() + nd * 86400000));
  const scan = (coll, dk, labelFn) => {
    const def = DEFS[coll];
    Store.list(coll).forEach(r => {
      if (def.late?.(r)) out.push({ coll, id: r.id, title: labelFn(r), sub: def.title + ' — استحق في ' + fmtDate(r[dk]), tag: 'متأخر', cls: 'p-red', due: r[dk], kind: 'late' });
      else if (r[dk] && r[dk] >= t && r[dk] <= lim && !DONE.includes(r.status)) out.push({ coll, id: r.id, title: labelFn(r), sub: def.title + ' — يستحق في ' + fmtDate(r[dk]), tag: 'قريب', cls: 'p-orange', due: r[dk], kind: 'soon' });
    });
  };
  if (Store.data.settings.notifyCritical !== false) Store.list('safety').filter(r => r.severity === 'حرج' && r.status !== 'مغلقة').forEach(r => out.push({ coll: 'safety', id: r.id, title: r.checkType + ' — ' + r.location, sub: 'ملاحظة سلامة حرجة مفتوحة', tag: 'حرج', cls: 'p-red', due: r.due, kind: 'critical' }));
  scan('improve', 'due', r => r.no + ' ' + r.action); scan('ops', 'end', r => r.no + ' ' + r.name); scan('dtasks', 'due', r => r.title);
  scan('decisions', 'due', r => r.text); scan('safety', 'due', r => r.no + ' ' + r.checkType); scan('pinits', 'end', r => r.name);
  return out;
}

  else if (act === 'add' && L && L.def.onAdd) L.def.onAdd(Object.fromEntries(Object.entries(L.preset).filter(([k]) => k !== 'fn')));
  else if (act === 'add' && L) openForm(L.def, null, Object.fromEntries(Object.entries(L.preset).filter(([k]) => k !== 'fn')));

function inScope(r, dk) {
  const d = S.dash;
  if (d.year !== 'all' && r.year && r.year !== d.year) return false;
  if (d.sem !== 'all' && r.semester && r.semester !== d.sem) return false;
  if (d.period === 'all' || !dk) return true;
  const v = r[dk]; if (!v) return false;
  const t = new Date();
  let from = '', to = '';
  if (d.period === 'month') { from = isoDate(new Date(t.getFullYear(), t.getMonth(), 1)); to = isoDate(new Date(t.getFullYear(), t.getMonth() + 1, 0)); }
  else if (d.period === '30') { from = isoDate(new Date(Date.now() - 30 * 86400000)); to = todayISO(); }
  else if (d.period === 'next30') { from = todayISO(); to = isoDate(new Date(Date.now() + 30 * 86400000)); }
  else if (d.period === 'custom') { from = d.from; to = d.to; }
  return (!from || v >= from) && (!to || v <= to);
}

/* Pull tabular content out of a file: Excel sheets, Word tables/lists, PowerPoint tables */
async function extractTables(file) {
  const ext = extOf(file.name), cands = [];
  if (['xlsx', 'xls', 'csv'].includes(ext)) {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    wb.SheetNames.forEach(n => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '' });
      const hdr = Math.max(0, rows.slice(0, 15).findIndex(r => r.filter(c => String(c).trim() !== '').length >= 2));
      if (rows.length > hdr + 1) cands.push({ name: n, headers: (rows[hdr] || []).map(h => String(h).trim()), rows: rows.slice(hdr + 1) });
    });
  } else if (ext === 'docx' && window.mammoth) {
    const r = await window.mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
    const doc = new DOMParser().parseFromString(r.value, 'text/html');
    doc.querySelectorAll('table').forEach((t, i) => {
      const rows = [...t.querySelectorAll('tr')].map(tr => [...tr.children].map(td => td.textContent.trim()));
      if (rows.length >= 2 && rows[0].length >= 1) cands.push({ name: 'جدول ' + (i + 1), headers: rows[0], rows: rows.slice(1) });
    });
    const items = [...doc.querySelectorAll('li')].map(li => li.textContent.trim()).filter(Boolean);
    if (!cands.length && items.length) cands.push({ name: 'القوائم', headers: [''], rows: items.map(t => [t]), list: true });
  } else if (ext === 'pptx' && window.JSZip) {
    const z = await window.JSZip.loadAsync(file);
    const slides = Object.keys(z.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((x, y) => parseInt(x.match(/\d+/)) - parseInt(y.match(/\d+/)));
    for (const n of slides) {
      const x = await z.file(n).async('string');
      [...x.matchAll(/<a:tbl>([\s\S]*?)<\/a:tbl>/g)].forEach((m, i) => {
        const rows = [...m[1].matchAll(/<a:tr[\s\S]*?<\/a:tr>/g)].map(tr => [...tr[0].matchAll(/<a:tc[\s\S]*?<\/a:tc>/g)].map(tc => [...tc[0].matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(t => t[1]).join(' ').replace(/&amp;/g, '&').trim()));
        if (rows.length >= 2) cands.push({ name: 'شريحة ' + n.match(/\d+/)[0] + ' جدول ' + (i + 1), headers: rows[0], rows: rows.slice(1) });
      });
    }
  }
  return cands;
}
/* Turn the best table into records for a section; missing required values get placeholders flagged for review */
function autoRecords(def, preset, cands, fileRec) {
  if (!cands.length) return { recs: [], skipped: 0, cand: null };
  let best = null;
  cands.forEach(c => { const map = autoMap(def, preset, c.headers); const sc = Object.keys(map).length * 10 + c.rows.length / 100; if (!best || sc > best.sc) best = { c, map, sc }; });
  const { c, map } = best;
  if (!Object.keys(map).length || !Object.values(map).includes(def.titleField)) {
    if (c.list || !Object.keys(map).length) { const free = c.headers.findIndex((h, i) => map[i] === undefined); if (free >= 0) map[free] = def.titleField; }
  }
  const fields = importFields(def, preset), recs = []; let skipped = 0;
  c.rows.forEach(row => {
    if (row.every(x => String(x).trim() === '')) return;
    const rec = { ...preset }, filled = [];
    Object.entries(map).forEach(([ci, k]) => { if (k) rec[k] = convertCell(def.f[k], row[ci], rec); });
    if (!String(rec[def.titleField] ?? '').trim()) { skipped++; return; }
    fields.forEach(f => {
      const empty = rec[f.k] === '' || rec[f.k] == null || (Array.isArray(rec[f.k]) && !rec[f.k].length);
      if (!empty) return;
      if (f.def) { rec[f.k] = f.def(); return; }
      if (!f.req) return;

  severity: ['الخطورة', 'درجة الخطورة'], location: ['الموقع', 'المكان'], text: ['القرار', 'التوصية', 'نص القرار'], specialty: ['التخصص'], subjects: ['المادة', 'المواد'], empNo: ['الرقم الوظيفي', 'السجل المدني'],
  checkType: ['نوع الفحص', 'البند'], desc2: []
};
function toNumAr(v) { if (typeof v === 'number') return v; const s = String(v ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g, '.').replace(/[%٪\s]/g, ''); const n = parseFloat(s); return isFinite(n) ? n : ''; }
function toDateAr(v) {
  if (v instanceof Date && !isNaN(v)) return isoDate(new Date(v.getTime() + 12 * 3600000));
  if (typeof v === 'number' && window.XLSX?.SSF) { const d = XLSX.SSF.parse_date_code(v); if (d) return d.y + '-' + pad2(d.m) + '-' + pad2(d.d); }
  const s = String(v ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/); if (m) return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/); if (m) return m[3] + '-' + pad2(m[2]) + '-' + pad2(m[1]);
  return '';
}
function matchOpt(fd, v, rec) {
  const n = normAr(v); if (!n) return '';
  const os = fieldOpts(fd, rec).filter(o => o.v !== '');
  const loose = s => normAr(s).split(' ').map(w => w.replace(/[يه]$/, '')).join('');
  return (os.find(o => normAr(o.l) === n || normAr(o.v) === n) || os.find(o => loose(o.l) === loose(v)) || os.find(o => { const a = normAr(o.l).replace(/ /g, ''), b = n.replace(/ /g, ''); return b.length > 2 && (a.includes(b) || b.includes(a)); }))?.v || '';
}
function importFields(def, preset) { return def.fields.filter(f => f.t !== 'computed' && !f.ro && !f.noform && !(f.k in preset)); }
function autoMap(def, preset, headers) {
  const fields = importFields(def, preset), used = new Set(), map = {};
  const scores = [];
  headers.forEach((h, ci) => {
    const nh = normAr(h); if (!nh) return;
    const nhc = nh.replace(/ /g, '');
    fields.forEach(f => {
      const nl = normAr(f.l), nlc = nl.replace(/ /g, '');
      let s = 0;
      if (nh === nl) s = 4;
      else if ((SYN[f.k] || []).some(x => normAr(x) === nh)) s = 3.5;
      else if (nhc.length > 2 && (nlc.includes(nhc) || nhc.includes(nlc))) s = 2.5;
      else { const hw = nh.split(' '), lw = nl.split(' '); const common = hw.filter(w => w.length > 2 && lw.includes(w)).length; if (common) s = common / Math.max(hw.length, lw.length) * 2; }
      if (s > 0.9) scores.push({ ci, k: f.k, s });
    });
  });
  scores.sort((a, b) => b.s - a.s).forEach(({ ci, k }) => { if (map[ci] === undefined && !used.has(k)) { map[ci] = k; used.add(k); } });

}
function convertCell(fd, v, rec) {
  if (v === '' || v == null) return '';

  if (fd.t === 'date') return toDateAr(v);
  if (fd.t === 'multi') { const parts = asArr(String(v)); const os = fieldOpts(fd, rec); return parts.map(p => os.find(o => normAr(o.v) === normAr(p))?.v || p); }
  if (fd.t === 'select' || fd.t === 'ref') return matchOpt(fd, v, rec);
  return String(v instanceof Date ? isoDate(v) : v).trim();
}
async function importWizard(def, preset = {}, file = null, opts = {}) {
  if (!Store.can('add', def.coll)) return toast('ليست لديك صلاحية الإضافة في هذا القسم', 'err');
  if (!window.XLSX) return toast('مكتبة Excel لم تُحمَّل. تحققي من الاتصال بالإنترنت.', 'err');
  if (!file) {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,.xls,.csv';
    inp.onchange = () => inp.files[0] && importWizard(def, preset, inp.files[0], opts); inp.click(); return;
  }
  let wb;
  try { wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true }); } catch (e) { return toast('تعذّرت قراءة الملف: ' + e.message, 'err'); }
  const st = { sheet: wb.SheetNames[0], map: {}, defaults: {}, pick: null, keep: !opts.fromLibrary && Store.can('add', 'files') };
  let rows = [], hdr = 0, headers = [];
  const loadSheet = () => {
    rows = XLSX.utils.sheet_to_json(wb.Sheets[st.sheet], { header: 1, defval: '' });
    hdr = Math.max(0, rows.slice(0, 15).findIndex(r => r.filter(c => String(c).trim() !== '').length >= 2));
    headers = (rows[hdr] || []).map(h => String(h).trim());
    st.map = autoMap(def, preset, headers);
  };
  loadSheet();
  const fields = importFields(def, preset);
  const build = () => {
    const ok = [], skipped = [];
    rows.slice(hdr + 1).forEach((row, ri) => {
      if (row.every(c => String(c).trim() === '')) return;
      const rec = { ...preset };
      Object.entries(st.map).forEach(([ci, k]) => { if (k) rec[k] = convertCell(def.f[k], row[ci], rec); });
      Object.entries(st.defaults).forEach(([k, v]) => { if ((rec[k] === '' || rec[k] == null || (Array.isArray(rec[k]) && !rec[k].length)) && v !== '') rec[k] = def.f[k].t === 'number' ? toNumAr(v) : v; });
      fields.forEach(f => { if (rec[f.k] == null && f.def) rec[f.k] = f.def(); });
      const missing = fields.filter(f => f.req && (rec[f.k] === '' || rec[f.k] == null || (Array.isArray(rec[f.k]) && !rec[f.k].length)));
      if (missing.length) skipped.push({ row: hdr + ri + 2, why: 'ينقصه: ' + missing.map(f => f.l).join('، ') });
      else ok.push(rec);
    });
    return { ok, skipped };
  };
  const mappedKeys = () => new Set(Object.values(st.map).filter(Boolean));
  const body = () => {
    const res = build(), mk = mappedKeys();
    const emptyIn = k => rows.slice(hdr + 1).some(row => { if (row.every(c => String(c).trim() === '')) return false; const ci = Object.keys(st.map).find(c => st.map[c] === k); const v = convertCell(def.f[k], row[ci], preset); return v === '' || v == null || (Array.isArray(v) && !v.length); });
    const needDef = fields.filter(f => (f.req || f.k === 'semester' || f.k === 'status') && (!mk.has(f.k) || emptyIn(f.k)));
    const sample = ci => { const v = rows.slice(hdr + 1).map(r => r[ci]).find(v => String(v).trim() !== ''); return v instanceof Date ? fmtDate(toDateAr(v)) : v; };
    const cols = def.table.filter(k => !(k in preset) && def.f[k].t !== 'computed').slice(0, 6);
    return `<div class="note-box">الملف: <b>${esc(file.name)}</b> — تعرّفت المنصة على <b>${mk.size}</b> من <b>${headers.filter(Boolean).length}</b> عمودًا تلقائيًا. راجعي المطابقة وغيّري ما يلزم ثم اضغطي «استيراد».</div>
    ${wb.SheetNames.length > 1 ? `<div class="frow"><b>ورقة العمل</b><div class="chips">${wb.SheetNames.map(n => `<button type="button" class="chip btnchip ${n === st.sheet ? 'on' : ''}" data-wsheet="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>` : ''}
    <div class="sec-h"><span>مطابقة أعمدة الملف مع حقول «${esc(def.title)}»</span></div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th class="nos">عمود الملف</th><th class="nos">مثال من البيانات</th><th class="nos">يقابله في المنصة</th></tr></thead><tbody>
    ${headers.map((h, ci) => h ? `<tr><td><b>${esc(h)}</b></td><td style="color:var(--muted)">${esc(String(sample(ci) ?? '').slice(0, 40))}</td><td><button type="button" class="chip btnchip ${st.map[ci] ? 'on' : ''}" data-mpick="${ci}">${st.map[ci] ? esc(def.f[st.map[ci]].l) : 'لا يُستورد'} ✎</button></td></tr>
      ${st.pick === ci ? `<tr><td colspan="3" style="background:var(--bg)"><div class="chips"><button type="button" class="chip btnchip ${!st.map[ci] ? 'on' : ''}" data-mset="${ci}" data-k="">لا يُستورد</button>${fields.map(f => `<button type="button" class="chip btnchip ${st.map[ci] === f.k ? 'on' : ''}" data-mset="${ci}" data-k="${f.k}" ${mk.has(f.k) && st.map[ci] !== f.k ? 'style="opacity:.55"' : ''}>${esc(f.l)}${f.req ? ' *' : ''}</button>`).join('')}</div></td></tr>` : ''}` : '').join('')}
    </tbody></table></div>
    ${needDef.length ? `<div class="sec-h"><span>قيم موحدة للخلايا الفارغة أو غير المطابقة في الحقول المطلوبة</span></div><div class="form">${needDef.map(f => {
      const v = st.defaults[f.k] ?? (f.def ? f.def() : '');
      if (f.def && st.defaults[f.k] === undefined) st.defaults[f.k] = v;
      if (f.t === 'select' || f.t === 'ref') return `<div class="f wide"><label>${esc(f.l)}${f.req ? ' <span class="req">*</span>' : ''}</label><div class="chips${fieldOpts(f, preset).length > 12 ? ' scroll' : ''}">${fieldOpts(f, preset).filter(o => o.v !== '').map(o => `<button type="button" class="chip btnchip ${String(v) === String(o.v) ? 'on' : ''}" data-dset="${f.k}" data-v="${esc(o.v)}">${esc(o.l)}</button>`).join('')}</div></div>`;
      return `<div class="f"><label for="dv-${f.k}">${esc(f.l)}${f.req ? ' <span class="req">*</span>' : ''}</label><input id="dv-${f.k}" type="${f.t === 'date' ? 'date' : f.t === 'number' ? 'number' : 'text'}" data-dinp="${f.k}" value="${esc(v)}"></div>`;
    }).join('')}</div>` : ''}
    <div class="sec-h"><span>معاينة قبل الاستيراد</span><span><span class="pill p-green">${res.ok.length} صف جاهز</span> ${res.skipped.length ? `<span class="pill p-orange">${res.skipped.length} صف سيُتجاهل</span>` : ''}</span></div>
    ${res.ok.length ? `<div class="tblwrap"><table class="tbl"><thead><tr>${cols.map(k => `<th class="nos">${esc(def.f[k].l)}</th>`).join('')}</tr></thead><tbody>${res.ok.slice(0, 5).map(r => `<tr>${cols.map(k => `<td>${esc(textVal(def, k, r))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${res.ok.length > 5 ? `<p style="color:var(--muted);font-size:.78rem">وصفوف أخرى (${res.ok.length - 5})…</p>` : ''}` : '<p class="lock">لا توجد صفوف مكتملة بعد. طابقي الأعمدة المطلوبة (*) أو حددي قيمًا موحدة لها.</p>'}
    ${res.skipped.length ? `<ul style="color:var(--muted);font-size:.8rem;margin:6px 0">${res.skipped.slice(0, 5).map(s => `<li>الصف ${s.row}: ${esc(s.why)}</li>`).join('')}</ul>` : ''}
    ${Store.can('add', 'files') && !opts.fromLibrary ? `<label class="chip" style="margin-top:8px"><input type="checkbox" id="imp-keep" ${st.keep ? 'checked' : ''}><span>حفظ الملف الأصلي في «ملفات المدرسة»</span></label>` : ''}`;
  };
  openModal({
    title: 'استيراد من Excel إلى ' + def.title, backdrop: false, body: body(),
    foot: `<button class="btn primary" data-imp>${icon('upload')}استيراد</button><button class="btn" data-close>إلغاء</button>`,
    bind: (m, close) => {
      const B = m.querySelector('.modal-b');
      const redraw = () => { const y = B.scrollTop; B.innerHTML = body(); B.scrollTop = y; const n = build().ok.length; m.querySelector('[data-imp]').innerHTML = icon('upload') + 'استيراد ' + n + ' سجل'; m.querySelector('[data-imp]').disabled = !n; };
      redraw();
      B.addEventListener('click', e => {
        const t = e.target;
        const ws = t.closest('[data-wsheet]'); if (ws) { st.sheet = ws.dataset.wsheet; st.pick = null; loadSheet(); return redraw(); }
        const pk = t.closest('[data-mpick]'); if (pk) { const ci = +pk.dataset.mpick; st.pick = st.pick === ci ? null : ci; return redraw(); }
        const ms = t.closest('[data-mset]'); if (ms) { const ci = +ms.dataset.mset, k = ms.dataset.k; if (k) Object.keys(st.map).forEach(c => { if (st.map[c] === k) delete st.map[c]; }); if (k) st.map[ci] = k; else delete st.map[ci]; st.pick = null; return redraw(); }

        let n = 0, fileRec = opts.fileRec || null;
        if (st.keep && !fileRec) {
          try { const a = { id: 'f' + uid(), name: file.name, ext: extOf(file.name), size: file.size, uploadedAt: new Date().toISOString(), by: Store.user.name }; await FileDB.put(a.id, file); fileRec = Store.add('files', { title: file.name.replace(/\.[^.]+$/, ''), category: CAT_OF_COLL[def.coll] || 'جداول وبيانات', related: REL_OF_MOD[def.module] || 'عام', desc: 'الملف الأصلي المستورد إلى ' + def.title, kind: 'Excel', uploaded: todayISO(), linkedTo: def.coll, attachments: [a] }, 'رفع ملف: ' + file.name); } catch (e) { toast('لم يُحفظ الملف الأصلي: ' + e.message, 'warn'); }

        } catch (e) { toast(e.message, 'err'); }

/* ---------- Library page ---------- */

  const all = Store.list('files');
  const by = k => all.filter(r => r.kind === k).length;
  const can = Store.can('add', 'files');
  const html = `${crumbs([{ l: 'ملفات المدرسة' }])}${pageHead('ملفات المدرسة', 'الخطط والجداول والتقارير والمحاضر المرفوعة بصيغها الأصلية مع معاينتها داخل المنصة')}
   ${can ? dropZoneHTML('lib-drop', 'اسحبي ملفات الخطط والجداول هنا أو اضغطي لاختيارها') : ''}
   <div class="grid kpis" style="margin:12px 0">
    <div class="kpi"><span class="k-l">إجمالي الملفات</span><span class="k-v">${all.length}</span><span class="k-s">${fmtSize(all.reduce((s, r) => s + (r.attachments?.[0]?.size || 0), 0))}</span></div>

    <div class="kpi"><span class="k-l">Word</span><span class="k-v">${by('Word')}</span></div>

    <div class="kpi"><span class="k-l">PowerPoint</span><span class="k-v">${by('PowerPoint')}</span></div>
    <div class="kpi"><span class="k-l">صور</span><span class="k-v">${by('صورة')}</span></div>
   </div>
   <div class="note-box">${FileDB.ok ? 'تُحفظ الملفات في هذا المتصفح على هذا الجهاز. ملفات Excel يمكن استيراد بياناتها مباشرة إلى سجلات المنصة من صفحة الملف.' : 'التخزين الدائم غير متاح في هذا المتصفح؛ الرفع مؤقت حتى إغلاق الصفحة.'}</div>
   ${listViewHTML('files', DEFS.files, {}, { label: 'الملفات' })}`;
  return { html, title: 'ملفات المدرسة', mount: () => bindDrop($('#lib-drop'), fs => openUpload({ files: fs })) };

/* Plan pages: upload plan files in any format + smart Excel import + list of related plan files */
function planFilesPanel(def, cat) {
  const fs = Store.list('files').filter(r => r.category === cat || r.related === REL_OF_MOD[def.module]).sort((a, b) => (b.uploaded || '').localeCompare(a.uploaded || ''));
  const canUp = Store.can('add', 'files'), canImp = Store.can('add', def.coll);
  return `<div class="panel" style="margin-bottom:12px"><div class="sec-h" style="margin-top:0"><span>${icon('folder')} ملفات ${esc(def.title)} (${fs.length})</span><span style="display:flex;gap:6px;flex-wrap:wrap">${canUp ? `<button class="btn sm primary" data-planup="${def.coll}">${icon('upload')}رفع ملف خطة</button>` : ''}${canImp ? `<button class="btn sm" data-planimp="${def.coll}">${icon('xls')}استيراد من Excel</button>` : ''}</span></div>
   ${fs.length ? `<div class="chips">${fs.slice(0, 12).map(r => `<button class="chip btnchip" data-act="open" data-ref="files|${r.id}"><b style="font-size:.7rem;opacity:.75">${esc((r.attachments?.[0]?.ext || '').toUpperCase())}</b> ${esc(r.title)}</button>`).join('')}${fs.length > 12 ? `<button class="chip btnchip" data-go="library">عرض الكل</button>` : ''}</div>` : `<p style="color:var(--muted);margin:0">لم تُرفع ملفات لهذه الخطة بعد.</p>`}</div>`;
}
['improve', 'ops'].forEach(k => {
  const orig = PAGES[k];
  PAGES[k] = () => {
    const o = orig(); const def = DEFS[k];
    o.html = o.html.replace('<div class="subtabs"', planFilesPanel(def, CAT_OF_COLL[k]) + '<div class="subtabs"');
    const m0 = o.mount;
    o.mount = () => {
      m0?.();
      $('[data-planup]')?.addEventListener('click', () => openUpload({ preset: { category: CAT_OF_COLL[k], related: REL_OF_MOD[k] }, importDef: def }));
      $('[data-planimp]')?.addEventListener('click', () => importWizard(def, {}));
    };
    return o;
  };
});
